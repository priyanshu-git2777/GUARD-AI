spring:
  config:
    import: optional:file:../../.env[.properties]

  application:
    name: tracedefend-platform

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tracedefend}
    username: ${POSTGRES_USER:tracedefend}
    password: ${POSTGRES_PASSWORD:tracedefend_dev_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:tracedefend}
    password: ${RABBITMQ_DEFAULT_PASS:tracedefend_dev_password}
    connection-timeout: 3s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: TraceDefend Platform
    version: 0.0.1

app:
  cors:
    allowed-origins:
      - ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:tracedefend-uploads}
    access-key: ${MINIO_ROOT_USER:tracedefend}
    secret-key: ${MINIO_ROOT_PASSWORD:tracedefend_minio_dev_password}
