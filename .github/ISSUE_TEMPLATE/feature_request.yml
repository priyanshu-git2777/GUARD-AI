name: Feature request
description: Propose a user problem and possible solution
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: user_problem
    attributes:
      label: User problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the user be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Proposed priority
      options:
        - MVP
        - Post-MVP
        - Optional
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy or operational risks
      description: Describe any risks introduced by this feature.
